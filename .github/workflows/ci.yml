name: CI

on:
  push:
    # v1.6.0 is the long-lived Phase 3 (template style variants) branch; it
    # pushes directly rather than through a PR, so without this its commits
    # never run CI at all. Update this when the next long-lived branch starts.
    branches: [main, v1.6.0]
  pull_request:

jobs:
  checks:
    name: Lint, build, and regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Reducer regression checks
        run: npm run check:reducers

      - name: Share-link codec regression checks
        run: npm run check:share

      - name: CV feedback regression checks
        run: npm run check:feedback

      - name: Word export regression checks
        run: npm run check:docx-export

      - name: Direct Edit section schema checks
        run: npm run check:section-schema

      - name: Section column-move rules checks
        run: npm run check:section-columns

      - name: Template page checks
        run: npm run check:template-pages

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e:fast

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-slow:
    name: End-to-end stress/PDF tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e:slow

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-slow
          path: playwright-report/
          retention-days: 7
