name: CI

on:
  push:
    # v1.3.0 is the long-lived Direct Edit branch; it pushes directly rather
    # than through a PR, so without this its commits never ran CI at all.
    branches: [main, v1.3.0]
  pull_request:

jobs:
  checks:
    name: Lint, build, and regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Reducer regression checks
        run: npm run check:reducers

      - name: Share-link codec regression checks
        run: npm run check:share

      - name: CV feedback regression checks
        run: npm run check:feedback

      - name: Word export regression checks
        run: npm run check:docx-export

      - name: Direct Edit template allowlist checks
        run: npm run check:direct-edit

      - name: Direct Edit section schema checks
        run: npm run check:section-schema

      - name: Section column-move rules checks
        run: npm run check:section-columns

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
